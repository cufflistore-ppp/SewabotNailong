<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pairing — Sewabot Nailong</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav" id="siteNav"></nav>
  <div class="pay-wrap">
    <div class="panel" style="text-align:center">
      <h2 style="color:var(--gold);justify-content:center">Pairing Code</h2>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:1rem" id="botInfo">—</p>
      <div id="codeBox" style="font-size:2rem;font-weight:900;letter-spacing:.18em;padding:1.2rem;background:#0a0a0a;border:1px dashed var(--border);border-radius:12px;margin-bottom:1rem;color:var(--gold)">— — — —</div>
      <button class="btn btn-primary btn-block" onclick="getCode()">Ambil / Refresh Kode</button>
      <p class="form-error" id="err"></p>
      <div style="text-align:left;margin-top:1.4rem;font-size:.88rem;color:var(--muted)">
        <strong style="color:var(--text)">Cara:</strong>
        <ol style="margin:.5rem 0 0 1.2rem;line-height:1.7">
          <li>WhatsApp → Perangkat Tertaut</li>
          <li>Tautkan dengan nomor telepon</li>
          <li>Masukkan kode 8 digit</li>
        </ol>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script>
    renderNav({ active: 'status', showAuth: false });
    const id = new URLSearchParams(location.search).get('id');
    (async () => {
      await requireAuth();
      if (!id) return;
      try {
        const { bots } = await api('/api/bots');
        const b = (bots||[]).find(x => String(x.id)===String(id));
        if (b) {
          document.getElementById('botInfo').textContent = b.bot_name + ' · ' + b.bot_type;
          if (b.pairing_code) document.getElementById('codeBox').textContent = b.pairing_code;
        }
      } catch {}
    })();
    async function getCode() {
      if (!id) return;
      try {
        const data = await api('/api/bots/'+id+'/pairing', { method:'POST' });
        document.getElementById('codeBox').textContent = data.pairing_code || '—';
      } catch (e) { document.getElementById('err').textContent = e.message; }
    }
  </script>
</body>
</html>
