<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Sewabot Nailong</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <span>SESSION // LOGIN</span>
        <div class="auth-dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      </div>
      <div class="auth-body">
        <img src="logo.png" alt="Nailong" class="auth-logo-img" />
        <h1>SELAMAT DATANG</h1>
        <p class="sub">Masuk untuk mengakses dashboard sewa bot.</p>
        <button class="btn btn-outline btn-block" onclick="doGoogle()">Masuk dengan Google</button>
        <div id="tgBox" style="margin-top:.6rem;display:flex;justify-content:center"></div>
        <div class="divider">atau</div>
        <form onsubmit="doLogin(event)">
          <div class="form-group"><label>Username</label><input name="username" required autocomplete="username"></div>
          <div class="form-group"><label>Password</label><input name="password" type="password" required></div>
          <button class="btn btn-primary btn-block">Masuk</button>
          <p class="form-error" id="err"></p>
        </form>
        <p class="auth-links">Belum punya akun? <a href="register.html">Daftar gratis</a></p>
        <p class="auth-links"><a href="index.html">← Kembali ke Beranda</a></p>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    initFirebase();
    getMe().then(u => { if (u) location.href = 'dashboard.html'; });
    loadAuthConfig().then(cfg => {
      const box = document.getElementById('tgBox');
      if (cfg.telegramBotUsername) {
        const s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-widget.js?22';
        s.setAttribute('data-telegram-login', cfg.telegramBotUsername);
        s.setAttribute('data-size', 'large');
        s.setAttribute('data-onauth', 'onTelegramAuth(user)');
        s.async = true;
        box.appendChild(s);
      }
    });
    async function doGoogle() {
      try { await loginGoogle(); location.href = 'dashboard.html'; }
      catch (e) { document.getElementById('err').textContent = e.message; }
    }
    async function doLogin(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      try { await loginLocal(fd.get('username'), fd.get('password')); location.href = 'dashboard.html'; }
      catch (err) { document.getElementById('err').textContent = err.message; }
    }
  </script>
</body>
</html>
