<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Bot — Sewabot Nailong</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav" id="siteNav"></nav>
  <div class="page-title">
    <h1>Status Bot</h1>
    <p>Monitor bot yang sedang berjalan</p>
  </div>
  <div class="dash">
    <div class="panel">
      <h2>Bot Aktif</h2>
      <div id="list"><p style="color:var(--muted)">Login untuk melihat status bot kamu.</p></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script>
    renderNav({ active: 'status' });
    (async () => {
      const u = await getMe();
      if (!u) return;
      try {
        const { bots } = await api('/api/bots');
        const el = document.getElementById('list');
        if (!bots?.length) { el.innerHTML = '<p style="color:var(--muted)">Belum ada bot.</p>'; return; }
        el.innerHTML = bots.map(b => `
          <div class="bot-row">
            <div class="name">${escapeHtml(b.bot_name)} <span class="badge-pill badge-${b.status}">${b.status}</span></div>
            <div class="meta">${b.bot_type} · ${b.expires_at ? 's/d ' + new Date(b.expires_at).toLocaleString('id-ID') : '—'}</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('list').innerHTML = '<p class="form-error">' + e.message + '</p>';
      }
    })();
  </script>
</body>
</html>
